name: Web CI

# Pushes to `web` are already checked and built by the Pages workflow, so this
# runs on pull requests only.
on:
  pull_request:
    branches:
      - web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check static Astro site
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check website
        run: npm run check

      - name: Build static website
        env:
          EDENDALE_CUSTOM_DOMAIN: edendale.babasama.com
        run: npm run build

      - name: Verify static output
        run: |
          test -f dist/.nojekyll
          test -f dist/CNAME
          test -f dist/.well-known/apple-app-site-association
          test -f dist/app_icon.png
