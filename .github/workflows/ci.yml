name: Horizon CI

# meta-horizon is the Meta Quest branch (HORIZON.md E.2): the hermetic JVM
# tests, the debug and unsigned release APKs, and the store-rule check on the
# release APK (E.1, without the signature checks). It uses no secrets: without
# .secret/horizon-signing.properties the release stays unsigned, and without
# secrets.json the build only disables the TMDB-, Wyzie-, and storage-provider
# features.

on:
  push:
    branches: [meta-horizon]
  pull_request:
    branches: [meta-horizon]

permissions: {}

concurrency:
  group: horizon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test, build, and verify the Horizon APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run hermetic tests, build the APKs, and check Meta's store rules
        run: ./gradlew --no-daemon testHorizonDebugUnitTest assembleHorizonDebug assembleHorizonRelease verifyHorizonRelease
