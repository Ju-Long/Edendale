# Release signing for the Meta Quest build (HORIZON.md A.3). Copy this file to
# the gitignored .secret/horizon-signing.properties and fill it in, or export
# HORIZON_STORE_FILE, HORIZON_STORE_PASSWORD, HORIZON_KEY_ALIAS, and
# HORIZON_KEY_PASSWORD instead (CI). With neither, assembleHorizonRelease
# writes an unsigned APK. Meta distributes the APK as signed, so every update
# must use the same key (decision D3: the Play upload key, alias key0).
storeFile=~/Documents/Edendale/New.jks
storePassword=
keyAlias=key0
keyPassword=
